<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Dino Run — Neural Autonomous Agent</title>
    <link rel="stylesheet" href="/src/client/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <!-- Unified Top Navbar -->
      <header class="app-nav">
        <div class="nav-brand">
          <div class="nav-logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <rect x="7" y="2" width="10" height="8" rx="1"/>
              <rect x="5" y="6" width="3" height="4"/>
              <rect x="15" y="4" width="2" height="2" fill="#ffffff"/>
              <rect x="9" y="10" width="8" height="6"/>
              <rect x="5" y="12" width="4" height="4"/>
              <rect x="3" y="14" width="2" height="4"/>
              <rect x="9" y="16" width="2" height="5"/>
              <rect x="14" y="16" width="2" height="5"/>
            </svg>
          </div>
          <span class="nav-title">Dino Run</span>
          <span class="nav-badge">Autonomous Agent</span>
        </div>

        <div class="nav-actions">
          <button id="btn-mute" class="nav-btn is-on" title="Toggle Sound (M)">
            <svg class="nav-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
            </svg>
            <span class="btn-label">SFX</span>
          </button>

          <button id="btn-retro" class="nav-btn" title="Toggle Retro Graphics (R)">
            <svg class="nav-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
            </svg>
            <span class="btn-label">Retro</span>
          </button>

          <button id="btn-ai" class="nav-btn is-ai" title="Toggle AI Autopilot (A)">
            <svg class="nav-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="10" rx="2"></rect>
              <circle cx="12" cy="5" r="2"></circle>
              <path d="M12 7v4"></path>
              <circle cx="8" cy="16" r="1" fill="currentColor"></circle>
              <circle cx="16" cy="16" r="1" fill="currentColor"></circle>
            </svg>
            <span class="btn-label">AI Autopilot: OFF</span>
          </button>
        </div>
      </header>

      <!-- Main Game Card -->
      <main class="game-card">
        <div id="game-container">
          <canvas id="game" width="600" height="150"></canvas>
          <div id="overlay"></div>
        </div>
        <footer class="game-controls-legend">
          <span class="legend-key"><kbd>Space</kbd> / <kbd>&uarr;</kbd> Jump</span>
          <span class="legend-dot">&bull;</span>
          <span class="legend-key"><kbd>&darr;</kbd> Duck</span>
          <span class="legend-dot">&bull;</span>
          <span class="legend-key"><kbd>A</kbd> AI Mode</span>
          <span class="legend-dot">&bull;</span>
          <span class="legend-key"><kbd>R</kbd> Retro</span>
          <span class="legend-dot">&bull;</span>
          <span class="legend-key"><kbd>M</kbd> Mute</span>
        </footer>
      </main>

      <!-- Neural Network Telemetry & Synaptic Deck -->
      <section id="ai-neural-panel" class="neural-deck is-hidden" aria-label="AI Decision & Neural Network Telemetry">
      </section>
    </div>

    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
